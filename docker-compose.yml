services:
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api:/var/www/api
    depends_on:
      - mysql
      - php
    networks:
      - app

  web:
    build:
      context: dockerfiles
      dockerfile: web.Dockerfile
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/var/www/web
    depends_on:
      - php
    networks:
      - app

  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    restart: unless-stopped
    volumes:
      - ./apps/api:/var/www/api
    command: >
      sh -c "chown -R www-data:www-data /var/www/api/storage /var/www/api/bootstrap/cache
      && php-fpm"
    networks:
      - app

  composer:
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
    volumes:
      - ./apps/api:/var/www/api
    networks:
      - app

  artisan:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - ./apps/api:/var/www/api
    entrypoint: ['php', '/var/www/api/artisan']
    networks:
      - app

  mysql:
    image: mysql:9.4
    restart: always
    ports:
      - '3306:3306'
    env_file:
      - env/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app

  phpmyadmin:
    image: phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - app

volumes:
  mysql_data:

networks:
  app:
    driver: bridge
